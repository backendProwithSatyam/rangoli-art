<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Radha Rani Rangoli</title>
<meta name="description" content="A Radha Rani rangoli drawn layer by layer by ten cursor agents. Open on a phone, tap, and screen-record the reel.">
<meta name="theme-color" content="#0a0807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radha Rani">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="reel" width="1080" height="1920" role="img" aria-label="Animated rangoli of Shri Radha Rani being drawn by ten cursor agents"></canvas>

<p id="loading" class="loading">Mixing the powder…</p>

<button id="start" class="start" type="button">
  <span class="title">श्री राधा रानी</span>
  <span class="tap">Tap to start</span>
  <span class="hint">Start your screen recording first</span>
</button>

<script type="module" src="src/main.js"></script>
</body>
</html>
